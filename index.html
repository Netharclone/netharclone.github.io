<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Netharclone</title>
  <style>
    :root { color-scheme: light dark; --bg: #f7f5f0; --text: #1d1d1f; --muted: #5d5a54; --rule: #ddd8cc; }
    @media (prefers-color-scheme: dark) { :root { --bg: #121316; --text: #ece6da; --muted: #a39d90; --rule: #2a2b30; } }
    body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 680px; margin: 0 auto; padding: 40px 20px 64px; }
    h1 { font-size: 30px; margin: 0 0 4px; letter-spacing: 0.5px; }
    h2 { font-size: 19px; margin: 32px 0 4px; }
    p { margin: 4px 0; }
    .muted { color: var(--muted); }
    a { color: inherit; }
  </style>
</head>
<body>
<main>
  <h1>Netharclone</h1>
  <p class="muted">Games made by Netharclone.</p>

  <h2>Slatebreak</h2>
  <p>A gritty drag-and-drop block puzzle for Android.</p>
  <p><a href="slatebreak/privacy/">Privacy policy</a></p>

  <h2>Nana's Sudoku</h2>
  <p>A calm, offline Sudoku for Android with no ads or tracking.</p>
  <p><a href="nanas-sudoku/privacy/">Privacy policy</a></p>

  <p class="muted" style="margin-top: 32px">Contact: <a href="mailto:Netharclone@gmail.com">Netharclone@gmail.com</a></p>
</main>
</body>
</html>
